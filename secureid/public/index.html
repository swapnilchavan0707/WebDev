<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SecureID - Authentication</title>

<!-- Inter font only. Font Awesome has been completely removed. -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Inter',sans-serif
}

:root{
 --blue:#2D5BFF;
 --blueLight:#EFF4FF;
 --blueBorder:#3B82F6;
 --border:#E5E7EB;
 --text:#111827;
 --muted:#6B7280;
 --muted2:#9CA3AF;
 --err:#DC2626;
 --errBg:#FEF2F2;
 --errBorder:#FECACA;
 --green:#16A34A;
 --greenBg:#DCFCE7;
 --greenLight:#F0FDF4;
 --cardShadow:0 10px 40px rgba(0,0,0,0.06);
}

body{
  background:#F8FAFF;
  min-height:100vh;
  color:var(--text)
}

/* =========================================================
   SVG ICON SYSTEM
   No Font Awesome / no external icon library
========================================================= */

.svg-icon{
  width:18px;
  height:18px;
  display:inline-block;
  vertical-align:middle;
  flex-shrink:0;
}

.svg-icon.sm{
  width:14px;
  height:14px;
}

.svg-icon.md{
  width:20px;
  height:20px;
}

.svg-icon.lg{
  width:26px;
  height:26px;
}

.svg-icon.xl{
  width:32px;
  height:32px;
}

/* =========================================================
   LAYOUT
========================================================= */

.app{
  display:flex;
  min-height:100vh
}

.sidebar{
  width:320px;
  background:linear-gradient(
    180deg,
    #6A8DFF 0%,
    #4B6CFF 30%,
    #2D5BFF 100%
  );
  display:flex;
  flex-direction:column;
  justify-content:space-between;
  padding:28px 26px;
  color:#fff;
  position:sticky;
  top:0;
  height:100vh;
}

.sidebar-top{
  display:flex;
  gap:12px;
  align-items:center;
  font-weight:700;
  font-size:18px
}

.sidebar-logo{
  width:40px;
  height:40px;
  background:rgba(255,255,255,0.22);
  border-radius:12px;
  display:grid;
  place-items:center;
  font-size:18px
}

.sidebar-mid{
  margin-top:auto;
  margin-bottom:auto
}

.sidebar-mid .s1{
  font-size:16px;
  font-weight:700;
  margin-bottom:4px
}

.sidebar-mid .s2{
  font-size:13px;
  opacity:.85
}

.sidebar-bot{
  font-size:11px;
  opacity:.6
}

/* WEB HEADER */

.web-header{
  height:64px;
  background:#fff;
  border-bottom:1px solid var(--border);
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 32px;
  position:sticky;
  top:0;
  z-index:10;
}

.web-header-left{
  display:flex;
  align-items:center;
  gap:10px;
  font-weight:700
}

.web-header-logo{
  width:32px;
  height:32px;
  background:#EFF4FF;
  color:var(--blue);
  border-radius:8px;
  display:grid;
  place-items:center;
  font-size:14px
}

/* STEPPER */

.stepper{
  display:flex;
  align-items:center;
  gap:10px
}

.step{
  width:28px;
  height:28px;
  border-radius:50%;
  display:grid;
  place-items:center;
  font-size:12px;
  font-weight:600;
  border:1.5px solid var(--border);
  background:#fff;
  color:var(--muted2)
}

.step.active{
  background:var(--blue);
  color:#fff;
  border-color:var(--blue)
}

.step.done{
  background:var(--blueLight);
  color:var(--blue);
  border-color:var(--blueLight)
}

.step-line{
  width:28px;
  height:2px;
  background:var(--border)
}

.step-line.done{
  background:var(--blue)
}

/* MAIN */

.main{
  flex:1;
  display:flex;
  justify-content:center;
  align-items:flex-start;
  padding:40px 16px;
  min-height:100vh
}

.card{
  width:100%;
  max-width:400px;
  background:#fff;
  border:1px solid #E9ECF2;
  border-radius:24px;
  padding:32px 28px;
  box-shadow:var(--cardShadow)
}

.card.web{
  max-width:440px
}

/* =========================================================
   COMMON UI
========================================================= */

.top-icon{
  width:72px;
  height:72px;
  border-radius:50%;
  display:grid;
  place-items:center;
  margin:4px auto 16px;
  font-size:26px;
}

.top-icon.blue{
  background:#EFF4FF;
  color:var(--blue)
}

.top-icon.red{
  background:#FEF2F2;
  color:var(--err)
}

.top-icon.green{
  background:#DCFCE7;
  color:var(--green)
}

.top-icon.shield-blue{
  background:#EFF4FF;
  color:var(--blue);
  border:1px solid #DBEAFE
}

.h-title{
  font-size:18px;
  font-weight:700;
  text-align:center
}

.h-sub{
  font-size:13px;
  color:var(--muted);
  text-align:center;
  margin-top:6px;
  line-height:1.5;
  margin-bottom:22px
}

.h-sub b{
  color:var(--text);
  font-weight:600
}

/* INPUT */

.label{
  font-size:11px;
  color:var(--muted);
  font-weight:500;
  margin-bottom:6px;
  display:block;
  margin-top:12px
}

.input{
  height:44px;
  border:1.5px solid var(--border);
  border-radius:12px;
  display:flex;
  align-items:center;
  padding:0 12px;
  gap:10px;
  background:#fff;
  transition:.15s
}

.input:focus-within{
  border-color:var(--blue);
  box-shadow:0 0 0 4px #EFF4FF
}

.input.err{
  border-color:var(--err);
  background:var(--errBg)
}

.input input,
.input select{
  flex:1;
  border:none;
  outline:none;
  background:transparent;
  font-size:13.5px;
  min-width:0
}

.input .ico{
  color:var(--muted2);
  font-size:13px;
  width:16px;
  text-align:center
}

.input .eye{
  color:var(--muted2);
  cursor:pointer;
  font-size:14px;
  display:flex;
  align-items:center;
  justify-content:center;
}

.err-text{
  color:var(--err);
  font-size:11px;
  margin-top:4px
}

.err-box{
  background:var(--errBg);
  border:1px solid var(--errBorder);
  color:var(--err);
  font-size:12px;
  padding:10px 12px;
  border-radius:10px;
  text-align:center;
  line-height:1.4;
  margin:12px 0
}

/* BUTTON */

.btn{
  width:100%;
  height:46px;
  background:var(--blue);
  color:#fff;
  border:none;
  border-radius:12px;
  font-weight:600;
  font-size:14px;
  cursor:pointer;
  margin-top:14px;
  transition:.15s
}

.btn:hover{
  background:#1D4ED8
}

.btn:disabled{
  opacity:.5;
  cursor:not-allowed
}

.btn-outline{
  width:100%;
  height:46px;
  background:#fff;
  border:1.5px solid var(--border);
  border-radius:12px;
  font-weight:600;
  font-size:13px;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  cursor:pointer
}

/* ROW */

.row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin:12px 0
}

.check{
  font-size:12px;
  display:flex;
  align-items:center;
  gap:6px;
  color:var(--text)
}

.check input{
  width:14px;
  height:14px
}

.link{
  color:var(--blue);
  font-size:12px;
  font-weight:600;
  cursor:pointer;
  text-decoration:none
}

.link:hover{
  text-decoration:underline
}

/* DIVIDER */

.divider{
  display:flex;
  align-items:center;
  gap:12px;
  margin:18px 0;
  color:var(--muted2);
  font-size:12px
}

.divider::before,
.divider::after{
  content:'';
  flex:1;
  height:1px;
  background:var(--border)
}

/* METHODS */

.method{
  border:1.5px solid var(--border);
  border-radius:14px;
  padding:14px 14px;
  display:flex;
  gap:12px;
  align-items:flex-start;
  margin-bottom:12px;
  cursor:pointer;
  background:#fff;
  transition:.15s
}

.method.selected{
  border-color:var(--blue);
  background:#F5F7FF
}

.method .m-ico{
  width:36px;
  height:36px;
  border-radius:10px;
  background:#F3F4F6;
  display:grid;
  place-items:center;
  font-size:14px;
  color:var(--muted)
}

.method.selected .m-ico{
  background:#DBEAFE;
  color:var(--blue)
}

.method .m-title{
  font-size:13px;
  font-weight:600
}

.method .m-sub{
  font-size:11px;
  color:var(--muted);
  margin-top:2px
}

.radio{
  margin-left:auto;
  width:20px;
  height:20px;
  border:2px solid #D1D5DB;
  border-radius:50%;
  display:grid;
  place-items:center;
  flex-shrink:0;
  margin-top:2px
}

.method.selected .radio{
  border-color:var(--blue)
}

.method.selected .radio::after{
  content:'';
  width:10px;
  height:10px;
  background:var(--blue);
  border-radius:50%
}

/* OTP */

.otp-row{
  display:flex;
  gap:8px;
  justify-content:center;
  margin:18px 0
}

.otp-row input{
  width:44px;
  height:52px;
  border:1.5px solid var(--border);
  border-radius:12px;
  text-align:center;
  font-size:20px;
  font-weight:700;
  outline:none;
  background:#fff
}

.otp-row input:focus{
  border-color:var(--blue);
  box-shadow:0 0 0 4px #EFF4FF
}

.otp-row input.err{
  border-color:var(--err);
  color:var(--err);
  background:var(--errBg)
}

.otp-row input.filled{
  border-color:#D1D5DB
}

.timer{
  font-size:12px;
  text-align:center;
  color:var(--muted)
}

.timer b{
  color:var(--blue);
  font-weight:700
}

.timer.err{
  color:var(--err)
}

.resend{
  font-size:12px;
  color:var(--blue);
  font-weight:600;
  text-align:center;
  margin-top:12px;
  cursor:pointer
}

.resend.disabled{
  color:var(--muted2);
  cursor:default
}

/* KEYPAD */

.keypad{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
  margin-top:22px
}

.key{
  height:52px;
  border:1px solid var(--border);
  border-radius:12px;
  background:#fff;
  font-weight:600;
  font-size:16px;
  cursor:pointer;
  display:grid;
  place-items:center
}

.key:active{
  background:#F3F4F6
}

/* PASSWORD CHECKS */

.pw-checks{
  margin:8px 0 10px 0
}

.pw-checks div{
  display:flex;
  gap:8px;
  align-items:center;
  font-size:11.5px;
  margin:5px 0;
  color:var(--muted)
}

.dot{
  width:16px;
  height:16px;
  border-radius:50%;
  display:grid;
  place-items:center;
  font-size:9px
}

.dot.ok{
  background:var(--greenBg);
  color:var(--green)
}

.dot.no{
  background:#F3F4F6;
  color:var(--muted2)
}

/* QR */

.qr-box{
  width:180px;
  height:180px;
  margin:20px auto;
  border:1px solid var(--border);
  border-radius:16px;
  display:grid;
  place-items:center;
  background:#fff;
  overflow:hidden
}

.tick{
  width:20px;
  height:20px;
  background:var(--greenBg);
  color:var(--green);
  border-radius:50%;
  display:grid;
  place-items:center;
  font-size:11px
}

/* MOBILE HEADER */

.mobile-top{
  height:54px;
  display:flex;
  align-items:center;
  padding:0 16px;
  gap:12px;
  border-bottom:1px solid var(--border);
  background:#fff
}

.back-btn{
  width:32px;
  height:32px;
  border-radius:10px;
  display:grid;
  place-items:center;
  cursor:pointer
}

.back-btn:hover{
  background:#F3F4F6
}

/* VIEW SWITCH */

.view-switch{
  position:fixed;
  top:12px;
  right:12px;
  z-index:100;
  background:#fff;
  border:1px solid var(--border);
  border-radius:24px;
  padding:4px;
  display:flex;
  gap:4px;
  box-shadow:0 4px 20px rgba(0,0,0,.08)
}

.view-switch button{
  padding:7px 14px;
  border-radius:20px;
  border:none;
  background:transparent;
  font-size:12px;
  font-weight:600;
  cursor:pointer
}

.view-switch button.active{
  background:var(--blue);
  color:#fff
}

/* =========================================================
   RESPONSIVE
========================================================= */

@media(max-width:900px){

  .app{
    flex-direction:column
  }

  .sidebar{
    width:100%;
    height:auto;
    position:relative;
    flex-direction:row;
    align-items:center;
    padding:16px 20px
  }

  .sidebar-mid,
  .sidebar-bot{
    display:none
  }

  .web-header{
    padding:0 16px
  }

  .stepper{
    gap:6px
  }

  .step{
    width:24px;
    height:24px;
    font-size:11px
  }

  .step-line{
    width:16px
  }

  .main{
    padding:20px 12px
  }
}

@media(max-width:520px){

  .view-switch{
    position:fixed;
    top:8px;
    right:8px;
    transform:scale(.9);
    transform-origin:top right
  }

  .card{
    padding:28px 20px;
    border-radius:20px
  }

  .otp-row{
    gap:6px
  }

  .otp-row input{
    width:42px
  }
}
</style>

async function api(path,body){

    method:'POST',
    headers:{

    credentials:'include',
    body:JSON.stringify(body)
  });

  const j=await r.json();

  if(!r.ok){
    throw j;
  }

  return j;
}

function pickMethod(el){

  el.classList.add('selected');
}


function toggleEye(id,iconEl){

  const inp=document.getElementById(id);

  if(!inp){
    return;
  }

  if(inp.type==='password'){

    inp.type='text';

    iconEl.innerHTML=icon(
      'eye-slash',
      'svg-icon sm'
    );

  }else{

    inp.type='password';

    iconEl.innerHTML=icon(
      'eye',
      'svg-icon sm'
    );

  }
}


async function doLogin(){

  try{

    const email=
      document
      .getElementById('le')
      .value
      .trim();

    const password=
      document
      .getElementById('lp')
      .value;

    emailForFlow=
      email ||
      'priya.sharma@email.com';

    const res=await api(
      '/api/login',
      {
        email:emailForFlow,
        password
      }
    );

    if(res.mfaRequired){

      challengeId=res.challengeId;

      loginStep=4;

      otp=['','','','','',''];

      startTimers(()=>{

        loginStep=6;

        renderLogin();

      });

      renderLogin();

    }else{

      alert('Login success');

    }

  }catch(e){

    loginStep=2;

    renderLogin();

  }

}


function startOtpFlow(){

  loginStep=4;

  otp=['','','','','',''];

  startTimers(()=>{

    loginStep=6;

    renderLogin();

  });

  renderLogin();

}


function onOtpIn(i,v){

  if(!/^\d$/.test(v)){

    document
      .getElementById('o'+i)
      .value='';

    return;

  }

  otp[i]=v;

  if(i<5){

    document
      .getElementById('o'+(i+1))
      ?.focus();

  }

  if(otp.every(x=>x!=='')){

    verifyOtp();

  }

}


function onOtpKey(i,e){

  if(e.key==='Backspace'){

    otp[i]='';

    if(i>0){

      document
        .getElementById('o'+(i-1))
        ?.focus();

    }

  }

}


function pressKey(k){

  if(k==='del'){

    for(let i=5;i>=0;i--){

      if(otp[i]!==''){

        otp[i]='';

        renderLogin();

        break;

      }

    }

    return;

  }


  const idx=
    otp.findIndex(v=>v==='');

  if(idx!==-1){

    otp[idx]=k;

    if(idx===5){

      verifyOtp();

    }else{

      renderLogin();

      setTimeout(()=>{

        document
          .getElementById('o'+(idx+1))
          ?.focus();

      },10);

    }

  }

}


async function verifyOtp(){

  try{

    const code=otp.join('');

    const res=await api(
      '/api/verify-login-otp',
      {
        challengeId,
        otp:code
      }
    );

    alert(
      'Login Success! Token: '+
      res.token.slice(0,20)+
      '...'

    loginStep=1;

    otp=['','','','','',''];

    renderLogin();

    if(e.code==='EXPIRED'){

      loginStep=6;

    }else{

      loginStep=5;

      attempts=e.attemptsLeft||2;

    }

    otp=['','','','','',''];

    renderLogin();

  }

}

/* =========================================================

========================================================= */

function checkPw(v){

  const checks=[

    {
      re:/.{8,}/,
      label:'At least 8 characters'
    },

    {
      re:/[A-Z]/,
      label:'1 uppercase letter'
    },

    {
      re:/[0-9]/,
      label:'1 number'
    },

    {
      re:/[^A-Za-z0-9]/,
      label:'1 special character'
    }

  ];


  const el=
    document.getElementById('pwChecks');

  if(!el){
    return;
  }


  el.innerHTML=

    checks.map(c=>{

      const ok=c.re.test(v);

      return `

        <div>

          <span
            class="dot ${ok?'ok':'no'}"
          >

            ${
              ok
              ?
              icon('check','svg-icon sm')
              :
              icon('dot','svg-icon sm')
            }

          </span>

          ${c.label}

        </div>

      `;

    }).join('');

}

async function doRegister(){

  try{

    const fullName=
      document
      .getElementById('rn')
      .value;

    const email=
      document
      .getElementById('re')
      .value
      .trim();

    const mobile=
      document
      .getElementById('rm')
      .value;

    const password=
      document
      .getElementById('rp')
      .value;


    emailForFlow=email;
    mobileForFlow=mobile;


    const res=await api(
      '/api/register',
      {
        fullName,
        email,
        mobile,
        password
      }
    );


    challengeId=res.challengeId;

    otp=['','','','','',''];

    expLeft=165;


    startTimers(()=>{

      regStep=4;

      renderRegister();

    });


    regStep=2;

    renderRegister();

  }catch(e){

    alert(
      e.error ||
      'Register failed'
    );

  }

}


async function onRegEmail(i,v){

  if(!/^\d$/.test(v)){
    return;
  }


  regOtp[i]=v;


  document
    .getElementById('ro'+i)
    .value=v;


  if(i<5){

    document
      .getElementById('ro'+(i+1))
      ?.focus();

  }


  if(regOtp.filter(Boolean).length===6){

    try{

      await api(
        '/api/verify-email-otp',
        {
          challengeId,
          otp:regOtp.join('')
        }
      );


      const sms=await api(
        '/api/send-sms-otp',
        {
          email:emailForFlow
        }
      );


      challengeId=sms.challengeId;

      regOtp=['','','','','',''];

      expLeft=165;


      startTimers(()=>{

        regStep=7;

        renderRegister();

      });


      regStep=5;

      renderRegister();

    }catch(e){

      attempts=e.attemptsLeft||2;


      if(e.code==='EXPIRED'){

        regStep=4;

      }else{

        regStep=3;

      }


      renderRegister();

    }

  }

}

async function autoFill(){

      '/api/_debug/otp/'+challengeId

    .split('')

      regOtp[i]=c;

      document
        .getElementById('ro'+i)
        .value=c;

    });


  await api(
    '/api/verify-email-otp',
    {
      challengeId,
      otp:j.otp
    }
  );


  challengeId=
    (
      await api(
        '/api/send-sms-otp',
        {
          email:emailForFlow

  regOtp=['','','','','',''];

function setMode(m){

  mode=m;

  document
    .getElementById('loginLayout')

      ?'flex'
      :'none';


  document
    .getElementById('regLayout')
    .style.display=
      m==='register'
      ?'flex'
      :'none';


  document
    .getElementById('swLogin')
    .classList
    .toggle(
      'active',
      m==='login'
    );


  document
    .getElementById('swReg')
    .classList
    .toggle(
      'active',
      m==='register'
    );


  if(m==='login'){

    loginStep=1;

    otp=['','','','','',''];

    renderLogin();

  }else{

    regStep=1;

    regOtp=['','','','','',''];

    renderRegister();
